<!DOCTYPE html>
<html lang="zh-Hans">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no" />
    <title>真实小猪试玩</title>
    <style>
      html, body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #c9c7c4;
        font-family: "PingFang SC", "Noto Sans SC", "Source Han Sans SC", "Microsoft YaHei", sans-serif;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
        cursor: grab;
      }
      #loading, #hint {
        position: fixed;
        left: 50%;
        transform: translateX(-50%);
        pointer-events: none;
        text-align: center;
      }
      #loading {
        top: 50%;
        transform: translate(-50%, -50%);
        color: #4a4744;
        font-size: 14px;
        letter-spacing: 0.04em;
      }
      #hint {
        bottom: 20px;
        max-width: min(520px, calc(100% - 32px));
        padding: 8px 14px;
        background: rgba(255, 255, 255, 0.78);
        color: #4a4744;
        border: 1px solid rgba(0, 0, 0, 0.08);
        border-radius: 10px;
        font-size: 13px;
        line-height: 1.5;
        backdrop-filter: blur(8px);
      }
      body.is-ready #loading { display: none; }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "./vendor/three.module.js",
          "three/addons/": "./vendor/addons/"
        }
      }
    </script>
  </head>
  <body>
    <div id="loading">正在载入 3D 模型…</div>
    <div id="hint">点按或轻拖小猪的肚皮、腮帮，软肉会微微晃动；在空白处拖动可旋转，滚轮或双指缩放。</div>
    <script type="module" src="./app.js"></script>
  </body>
</html>
